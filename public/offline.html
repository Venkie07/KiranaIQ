<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KiranaIQ — Offline</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f8f7fc;color:#1f1635;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{background:white;border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 12px rgba(31,22,53,.08)}
    .icon{width:64px;height:64px;margin:0 auto 16px;background:#ede9fe;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .icon svg{width:32px;height:32px;color:#6d28d9}
    h1{font-size:1.5rem;margin-bottom:8px}
    p{color:#6b647a;line-height:1.6;margin-bottom:24px}
    .retry{background:#6d28d9;color:white;border:none;padding:12px 24px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
    .retry:hover{background:#5b21b6}
    @media (prefers-color-scheme: dark){
      body{background:#0b1020;color:#f4f3ff}
      .container{background:#111a30;box-shadow:0 4px 14px rgba(0,0,0,.45)}
      .icon{background:#2b2150}
      p{color:#b6bed3}
      .retry{background:#a78bfa}
      .retry:hover{background:#c4b5fd}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
    </div>
    <h1>KiranaIQ — Offline</h1>
    <p>You're offline. KiranaIQ keeps working and saves your data on this device.</p>
    <button class="retry" onclick="window.location.reload()">Try again</button>
    <p style="margin-top:16px;font-size:.85rem;color:#6b647a">தமிழ்: ஆஃப்லைன். எல்லாம் இந்தச் சாதனத்தில் சேமிக்கப்படுகிறது.</p>
    <p style="margin-top:4px;font-size:.85rem;color:#6b647a">हिन्दी: ऑफ़लाइन। सब कुछ इस डिवाइस पर सेव होता है।</p>
  </div>
</body>
</html>
